<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redline test page</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #18181b;
        background: #fafafa;
      }
      header {
        padding: 24px 40px;
        background: #1e293b;
        color: #f8fafc;
      }
      main {
        padding: 40px;
        max-width: 800px;
      }
      .hero {
        padding: 32px;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
      }
      .cta {
        padding: 8px 16px;
        font: inherit;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 6px;
      }
      .tall {
        height: 1600px;
        margin-top: 40px;
        background: linear-gradient(#f4f4f5, #e4e4e7);
        border-radius: 12px;
      }
      footer {
        padding: 40px;
      }
    </style>
  </head>
  <body>
    <header><h1 id="title">Acme dashboard</h1></header>
    <main id="app">
      <section class="hero">
        <h2>Welcome back</h2>
        <p>The quick brown fox jumps over the lazy dog.</p>
        <button class="cta">Sign up</button>
        <button class="cta secondary">Log in</button>
      </section>
      <div class="tall"></div>
    </main>
    <footer id="footer">The footer, far below.</footer>
  </body>
</html>
